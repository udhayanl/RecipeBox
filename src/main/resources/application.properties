# Application Configuration
spring.application.name=RecipeBox
server.port=8080

# Default Database Configuration (Instant In-Memory DB with MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:recipebox;DB_CLOSE_DELAY=-1;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true

# H2 Console enabled at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger / OpenAPI UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
