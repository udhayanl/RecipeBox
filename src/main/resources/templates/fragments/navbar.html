<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="navbar" class="app-navbar">
    <div class="d-flex align-items-center gap-3">
        <!-- Mobile Sidebar Toggle -->
        <button type="button" id="sidebarToggle" class="btn btn-rb-ghost d-lg-none p-1" aria-label="Toggle navigation">
            <i class="bi bi-list fs-3"></i>
        </button>

        <!-- Search Bar -->
        <form th:action="@{/recipes}" method="get" class="d-none d-md-flex align-items-center position-relative" style="width: 320px;">
            <i class="bi bi-search position-absolute text-muted" style="left: 14px;"></i>
            <input type="text" name="search" class="form-control ps-5 py-2" placeholder="Search recipes or ingredients..." th:value="${searchTerm}">
        </form>
    </div>

    <!-- Right utility icons -->
    <div class="d-flex align-items-center gap-3">
        <!-- Notifications dropdown -->
        <div class="dropdown">
            <button class="btn btn-rb-ghost position-relative p-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-bell fs-5"></i>
                <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
                    <span class="visually-hidden">New alerts</span>
                </span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-3 p-2" style="width: 280px;">
                <li class="dropdown-header fw-bold text-dark">Notifications</li>
                <li><hr class="dropdown-divider"></li>
                <li class="p-2 small text-muted">
                    <i class="bi bi-calendar-check text-success me-2"></i>Weekly meal plan is ready for review!
                </li>
                <li class="p-2 small text-muted">
                    <i class="bi bi-cart3 text-warning me-2"></i>Shopping list updated with 12 items.
                </li>
            </ul>
        </div>

        <!-- User profile dropdown -->
        <div class="dropdown">
            <button class="btn btn-link text-decoration-none p-0 d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="user-avatar" style="width: 38px; height: 38px;" th:text="${session.CURRENT_USER_NAME != null ? #strings.substring(session.CURRENT_USER_NAME, 0, 1) : 'U'}">
                    U
                </div>
                <span class="d-none d-lg-inline fw-semibold text-dark small" th:text="${session.CURRENT_USER_NAME != null ? session.CURRENT_USER_NAME : 'Home Cook'}">Home Cook</span>
                <i class="bi bi-chevron-down text-muted small"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-3 p-2">
                <li><a class="dropdown-item rounded-2 py-2" th:href="@{/profile}"><i class="bi bi-person me-2"></i>My Profile</a></li>
                <li><a class="dropdown-item rounded-2 py-2" th:href="@{/favorites}"><i class="bi bi-heart me-2"></i>Favorites</a></li>
                <li><a class="dropdown-item rounded-2 py-2" th:href="@{/shopping-list}"><i class="bi bi-cart me-2"></i>Shopping List</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item rounded-2 py-2 text-danger" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2"></i>Sign Out</a></li>
            </ul>
        </div>
    </div>
</header>
</body>
</html>
