<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Create Account')}"></head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <!-- Logo and Title -->
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">
                <i class="bi bi-egg-fried"></i>
            </div>
            <h2 class="fw-bold mb-1">Recipe<span class="text-rb-primary">Box</span></h2>
            <p class="text-muted small">Start organizing recipes and planning weekly meals effortlessly.</p>
        </div>

        <!-- Flash messages -->
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <!-- Register Form -->
        <form th:action="@{/register}" method="post">
            <div class="mb-3">
                <label for="regName" class="form-label">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" id="regName" name="name" class="form-control border-start-0"
                           placeholder="Chef Jane Doe" th:value="${name}" required />
                </div>
            </div>

            <div class="mb-3">
                <label for="regEmail" class="form-label">Email address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="regEmail" name="email" class="form-control border-start-0"
                           placeholder="jane@example.com" th:value="${email}" required />
                </div>
            </div>

            <div class="mb-3">
                <label for="regPassword" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" id="regPassword" name="password" class="form-control border-start-0 border-end-0"
                           placeholder="At least 6 characters" required />
                    <button type="button" class="btn btn-outline-secondary border-start-0 toggle-password-btn" data-target="regPassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control border-start-0 border-end-0"
                           placeholder="Repeat password" required />
                    <button type="button" class="btn btn-outline-secondary border-start-0 toggle-password-btn" data-target="confirmPassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-rb-primary w-100 py-2 mb-3 shadow-sm">
                Create Account
            </button>

            <div class="text-center small text-muted">
                Already have an account?
                <a th:href="@{/login}" class="fw-bold text-rb-primary ms-1">Log in here</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
