<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('My Profile')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('profile')}"></div>
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

    <div class="app-main">
        <header th:replace="~{fragments/navbar :: navbar}"></header>

        <main class="app-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Page Title -->
            <div class="mb-4">
                <h2 class="fw-bold mb-1">Profile &amp; Account Settings</h2>
                <p class="text-muted mb-0">Manage your personal chef profile, email, credentials, and app preferences.</p>
            </div>

            <div class="row g-4">
                <!-- User Overview Card -->
                <div class="col-lg-4">
                    <div class="rb-card p-4 text-center">
                        <div class="user-avatar mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2rem;">
                            <span th:text="${user.name != null ? #strings.substring(user.name, 0, 1) : 'U'}">U</span>
                        </div>
                        <h4 class="fw-bold text-dark mb-1" th:text="${user.name}">Alex Morgan</h4>
                        <p class="text-muted small mb-3" th:text="${user.email}">alex@example.com</p>
                        <span class="badge bg-rb-light text-rb-primary border px-3 py-1 rounded-pill">Active Chef</span>

                        <hr class="my-4" />

                        <!-- Quick Stats in Profile -->
                        <div class="row g-2 text-center">
                            <div class="col-4">
                                <div class="fs-4 fw-bold text-dark" th:text="${recipeCount}">4</div>
                                <div class="text-muted" style="font-size: 0.72rem;">Recipes</div>
                            </div>
                            <div class="col-4">
                                <div class="fs-4 fw-bold text-danger" th:text="${favoriteCount}">2</div>
                                <div class="text-muted" style="font-size: 0.72rem;">Favorites</div>
                            </div>
                            <div class="col-4">
                                <div class="fs-4 fw-bold text-warning" th:text="${mealPlanCount}">5</div>
                                <div class="text-muted" style="font-size: 0.72rem;">Meals</div>
                            </div>
                        </div>

                        <hr class="my-4" />

                        <a th:href="@{/logout}" class="btn btn-outline-danger w-100 rounded-pill">
                            <i class="bi bi-box-arrow-right me-1"></i> Sign Out
                        </a>
                    </div>
                </div>

                <!-- Profile Edit Form -->
                <div class="col-lg-8">
                    <div class="rb-card p-4">
                        <h5 class="fw-bold mb-3 d-flex align-items-center gap-2 border-bottom pb-2">
                            <i class="bi bi-gear text-rb-primary"></i> Account Information
                        </h5>

                        <form th:action="@{/profile/update}" method="post">
                            <div class="mb-3">
                                <label for="profileName" class="form-label">Full Name</label>
                                <input type="text" id="profileName" name="name" class="form-control" th:value="${user.name}" required />
                            </div>

                            <div class="mb-3">
                                <label for="profileEmail" class="form-label">Email Address</label>
                                <input type="email" id="profileEmail" class="form-control bg-light" th:value="${user.email}" readonly disabled />
                                <div class="form-text small">Your email address is your unique login identifier.</div>
                            </div>

                            <div class="mb-3">
                                <label for="profilePassword" class="form-label">Update Password (leave blank to keep current)</label>
                                <div class="input-group">
                                    <input type="password" id="profilePassword" name="newPassword" class="form-control" placeholder="New secure password" />
                                    <button type="button" class="btn btn-outline-secondary toggle-password-btn" data-target="profilePassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                <button type="submit" class="btn btn-rb-primary px-4 rounded-pill">
                                    <i class="bi bi-check2 me-1"></i> Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
