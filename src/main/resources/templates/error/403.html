<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('403 – Access Denied')}"></head>
<body>
<div class="auth-wrapper">
    <div class="auth-card text-center p-5">
        <div class="display-1 mb-2">🔒</div>
        <h1 class="display-5 fw-bold text-dark mb-2">403</h1>
        <h4 class="fw-bold text-muted mb-3">Kitchen Door Locked</h4>
        <p class="text-muted small mb-4">
            You do not have permission to view or edit this recipe or resource.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/dashboard}" class="btn btn-rb-primary px-4 rounded-pill">
                <i class="bi bi-house me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
</body>
</html>
