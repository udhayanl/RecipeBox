<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('500 – Server Error')}"></head>
<body>
<div class="auth-wrapper">
    <div class="auth-card text-center p-5">
        <div class="display-1 mb-2">🔥</div>
        <h1 class="display-5 fw-bold text-dark mb-2">500</h1>
        <h4 class="fw-bold text-muted mb-3">Something burned in the kitchen!</h4>
        <p class="text-muted small mb-4">
            An unexpected error occurred while processing your request. Our chefs are looking into it.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/dashboard}" class="btn btn-rb-primary px-4 rounded-pill">
                <i class="bi bi-house me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
</body>
</html>
