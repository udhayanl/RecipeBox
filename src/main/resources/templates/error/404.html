<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('404 – Recipe Not Found')}"></head>
<body>
<div class="auth-wrapper">
    <div class="auth-card text-center p-5">
        <div class="display-1 mb-2">🍳</div>
        <h1 class="display-5 fw-bold text-dark mb-2">404</h1>
        <h4 class="fw-bold text-muted mb-3">Oops! Recipe Not Found</h4>
        <p class="text-muted small mb-4">
            The recipe, meal plan, or page you are looking for does not exist, was deleted, or the link may be broken.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/recipes}" class="btn btn-rb-primary px-4 rounded-pill">
                <i class="bi bi-journal-bookmark me-1"></i> Back to Recipes
            </a>
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary px-4 rounded-pill">
                <i class="bi bi-house me-1"></i> Dashboard
            </a>
        </div>
    </div>
</div>
</body>
</html>
